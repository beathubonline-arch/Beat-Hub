<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | BeatHub</title>
    <style>
        :root{--gold:#d4af37;--gold2:#f4d675;--bg:#050505;--panel:#101010;--muted:#a7a7a7;--border:rgba(212,175,55,.24)}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,rgba(212,175,55,.12),transparent 30%),#050505;color:#f7f7f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
        .wrap{min-height:100vh;display:grid;place-items:center;padding:30px 18px}.card{width:min(680px,100%);padding:34px;border:1px solid var(--border);border-radius:26px;background:rgba(16,16,16,.94);box-shadow:0 30px 80px rgba(0,0,0,.6)}
        .brand{font-size:25px;font-weight:900;margin-bottom:26px}.brand span{color:var(--gold)}h1{font-size:34px;margin:0 0 8px;letter-spacing:-1.2px}.sub{color:var(--muted);line-height:1.6;margin:0 0 25px}
        .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 24px}.role{position:relative}.role input{position:absolute;opacity:0}.role label{display:block;padding:17px 13px;border:1px solid rgba(255,255,255,.1);border-radius:15px;background:#0b0b0b;cursor:pointer;height:100%;transition:.2s}.role label:hover{border-color:rgba(212,175,55,.45);transform:translateY(-1px)}.role input:checked+label{border-color:var(--gold);background:rgba(212,175,55,.09);box-shadow:0 0 0 2px rgba(212,175,55,.08)}.role strong{display:block;margin-bottom:5px}.role small{color:var(--muted);line-height:1.4}
        .field{margin-bottom:17px}label.field-label{display:block;font-size:12px;font-weight:800;margin-bottom:8px;color:#ddd}.input{width:100%;height:52px;padding:0 15px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:#090909;color:#fff;outline:0;font-size:14px}.input:focus{border-color:rgba(212,175,55,.7);box-shadow:0 0 0 4px rgba(212,175,55,.07)}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.terms{display:flex;gap:10px;align-items:flex-start;color:#aaa;font-size:13px;line-height:1.5;margin:5px 0 20px}.terms input{margin-top:3px;accent-color:var(--gold)}.terms a{color:var(--gold2)}button{width:100%;height:54px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080808;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 12px 30px rgba(212,175,55,.18)}button:hover{filter:brightness(1.05);transform:translateY(-1px)}.login{margin-top:18px;text-align:center;color:var(--muted);font-size:13px}.login a{color:var(--gold2);text-decoration:none}.alert{padding:13px 15px;border-radius:12px;margin-bottom:18px;font-size:13px}.error{color:#ffd0d0;background:rgba(255,75,75,.08);border:1px solid rgba(255,75,75,.22)}
        @media(max-width:650px){.card{padding:25px 20px}.roles{grid-template-columns:1fr}.row{grid-template-columns:1fr}h1{font-size:29px}}
    </style>
</head>
<body>
<div class="wrap">
    <main class="card">
        <div class="brand">Beat<span>Hub</span></div>
        <h1>Create your BeatHub account</h1>
        <p class="sub">Choose how you will use BeatHub. Artists and producers can publish music, albums, merchandise and their own public store. Buyers can discover and purchase.</p>

        {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

        <form method="post" action="/signup">
            <div class="field">
                <label class="field-label">ACCOUNT TYPE</label>
                <div class="roles">
                    <div class="role">
                        <input id="artist" type="radio" name="role" value="artist" {% if role == 'artist' %}checked{% endif %}>
                        <label for="artist"><strong>🎤 Artist</strong><small>Release tracks, create albums, merch and your store.</small></label>
                    </div>
                    <div class="role">
                        <input id="producer" type="radio" name="role" value="creator" {% if role == 'creator' %}checked{% endif %}>
                        <label for="producer"><strong>🎹 Producer</strong><small>Upload beats, albums, merch and manage your store.</small></label>
                    </div>
                    <div class="role">
                        <input id="buyer" type="radio" name="role" value="buyer" {% if role not in ['artist','creator'] %}checked{% endif %}>
                        <label for="buyer"><strong>🎧 Buyer</strong><small>Discover, license and purchase music.</small></label>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="field"><label class="field-label" for="stage_name">ARTIST / STAGE NAME <span style="font-weight:600;color:#888;text-transform:none;letter-spacing:0">(e.g. Mr Mapema)</span></label><input class="input" id="stage_name" name="stage_name" value="{{ stage_name or '' }}" placeholder="e.g. Mr Mapema" required maxlength="255" autocomplete="nickname"></div>
                <div class="field"><label class="field-label" for="email">EMAIL</label><input class="input" id="email" name="email" type="email" value="{{ email or '' }}" required maxlength="255" autocomplete="email"></div>
            </div>
            <div class="row">
                <div class="field"><label class="field-label" for="password">PASSWORD</label><input class="input" id="password" name="password" type="password" required minlength="8" autocomplete="new-password"></div>
                <div class="field"><label class="field-label" for="confirm_password">CONFIRM PASSWORD</label><input class="input" id="confirm_password" name="confirm_password" type="password" required minlength="8" autocomplete="new-password"></div>
            </div>

            <label class="terms"><input type="checkbox" name="agree_terms" value="1" required><span>I agree to the <a href="/terms" target="_blank" rel="noopener">BeatHub Terms &amp; Conditions</a>.</span></label>
            <button type="submit">Create BeatHub Account</button>
        </form>
        <div class="login">Already have an account? <a href="/login">Log in</a></div>
    </main>
</div>
<script>
(function(){
    const params=new URLSearchParams(window.location.search);
    const requested=params.get('role');
    if(requested==='artist'||requested==='creator'||requested==='buyer'){
        const radio=document.querySelector('input[name="role"][value="'+requested+'"]');
        if(radio) radio.checked=true;
    }
})();
</script>
</body>
</html>
