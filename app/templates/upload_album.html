{% extends "base.html" %}

{% block title %}Create Album — BeatHub{% endblock %}

{% block content %}

<section style="padding:30px 0; max-width:600px;">

  <h1 style="font-size:28px;">
    Create Album
  </h1>

  {% if error %}
    <div class="alert alert-error">
      {{ error }}
    </div>
  {% endif %}

  <form
    action="/dashboard/albums/new"
    method="post"
    enctype="multipart/form-data"
  >

    <div class="field">
      <label>Album Title</label>
      <input
        type="text"
        name="title"
        required
      >
    </div>

    <div class="field">
      <label>Description</label>
      <textarea
        name="description"
        rows="3"
      ></textarea>
    </div>

    <div class="field">
      <label>Genre</label>
      <input
        type="text"
        name="genre"
      >
    </div>

    <div class="field">
      <label>Artwork</label>
      <input
        type="file"
        name="artwork"
        accept=".jpg,.jpeg,.png,.webp"
      >
    </div>

    <div class="field">

      <label>Select Tracks</label>

      {% for track in tracks %}

        <div class="checkbox-row">

          <input
            type="checkbox"
            id="t{{ loop.index }}"
            name="track_ids"
            value="{{ track.id }}"
          >

          <label
            for="t{{ loop.index }}"
            style="margin:0;text-transform:none;"
          >
            {{ track.title }}
          </label>

        </div>

      {% else %}

        <p class="sub">

          You need to upload tracks before creating an album.

          <a
            href="/dashboard/upload"
            style="color:var(--gold);"
          >
            Upload a track
          </a>

        </p>

      {% endfor %}

    </div>

    <button
      type="submit"
      class="btn btn-primary btn-block"
    >
      Create Album
    </button>

  </form>

</section>

{% endblock %}
