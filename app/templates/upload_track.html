{% extends "base.html" %}
{% block title %}Upload Tracks — BeatHub{% endblock %}
{% block content %}
<section style="padding: 30px 0; max-width: 760px;">
  <h1 style="font-size: 28px;">Upload Beats / Tracks</h1>
  <p class="sub" style="color: var(--text-muted);">Add one track, or click "Add another track" to upload several at once.</p>

  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

  <form action="/dashboard/upload" method="post" enctype="multipart/form-data" id="upload-form">
    <div id="track-rows"></div>
    <button type="button" class="btn btn-outline" onclick="addTrackRow()" style="margin: 10px 0 24px;">+ Add another track</button>
    <button type="submit" class="btn btn-primary btn-block">Upload</button>
  </form>
</section>

<template id="track-row-template">
  <div class="form-card" style="margin-bottom: 20px;">
    <div class="field"><label>Title</label><input type="text" name="titles" required></div>
    <div class="field"><label>Description</label><textarea name="descriptions" rows="3"></textarea></div>
    <div class="field"><label>Genre</label><input type="text" name="genres"></div>
    <div class="field"><label>BPM</label><input type="number" name="bpms" min="1"></div>
    <div class="field"><label>Tags (comma-separated)</label><input type="text" name="tags_list"></div>
    <div class="field"><label>Price (KSh)</label><input type="number" step="0.01" min="0" name="prices" required></div>
    <div class="field">
      <label>Sales Model</label>
      <select name="sales_models">
        <option value="non_exclusive">Non-Exclusive (can be sold to multiple buyers)</option>
        <option value="exclusive">Exclusive (one-time purchase only)</option>
      </select>
    </div>
    <div class="field"><label>Audio File</label><input type="file" name="audio_files" accept=".mp3,.wav,.m4a,.flac" required></div>
    <div class="field"><label>Cover Art (optional)</label><input type="file" name="cover_files" accept=".jpg,.jpeg,.png,.webp"></div>
    <button type="button" class="btn btn-outline" onclick="this.closest('.form-card').remove()">Remove this track</button>
  </div>
</template>

<script>
  function addTrackRow() {
    const tpl = document.getElementById('track-row-template');
    const clone = tpl.content.cloneNode(true);
    document.getElementById('track-rows').appendChild(clone);
  }
  addTrackRow();
</script>
{% endblock %}
