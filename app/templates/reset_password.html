{% extends "base.html" %}
{% block title %}Set a new password — BeatHub{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <div class="brand">BEAT<span class="hub">HUB</span></div>
    <h2>Set a new password</h2>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    {% if valid %}
      <form action="/reset-password" method="post">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="field">
          <label>New Password</label>
          <input type="password" name="password" minlength="8" required autofocus>
        </div>
        <div class="field">
          <label>Confirm New Password</label>
          <input type="password" name="confirm_password" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update password</button>
      </form>
    {% else %}
      <p class="subtitle">This reset link is invalid or has expired.</p>
      <a href="/forgot-password" class="btn btn-primary btn-block">Request a new link</a>
    {% endif %}
  </div>
</div>
{% endblock %}
