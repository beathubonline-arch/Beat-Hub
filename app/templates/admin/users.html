{% extends "admin/base_admin.html" %}
{% block admin_content %}
<h1 style="font-size: 26px;">Users</h1>
<form method="get" style="margin: 16px 0; max-width:400px;" class="search-input-row">
  <input type="text" name="q" class="search-input" placeholder="Search by email" value="{{ q }}">
  <button type="submit" class="btn btn-primary">Search</button>
</form>
<table class="data-table">
  <thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th></th></tr></thead>
  <tbody>
    {% for u in users %}
      <tr>
        <td>{{ u.email }}</td>
        <td>{{ u.role.value }}</td>
        <td>{{ 'Active' if u.is_active else 'Deactivated' }}</td>
        <td>{{ u.created_at.strftime('%d %b %Y') }}</td>
        <td>
          <form action="/admin/users/{{ u.id }}/toggle-active" method="post">
            <button type="submit" class="btn btn-outline">{{ 'Deactivate' if u.is_active else 'Activate' }}</button>
          </form>
        </td>
      </tr>
    {% else %}<tr><td colspan="5" class="sub">No users found.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
