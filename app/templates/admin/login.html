<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BeatHub — Administrator Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --gold: #f4c842;
            --gold-light: #ffe58a;
            --gold-dark: #c99b1c;

            --bg: #070707;
            --panel: #0e0e0e;
            --panel-2: #111111;

            --border: rgba(255, 255, 255, .075);
            --border-gold: rgba(244, 200, 66, .18);

            --text: #ffffff;
            --muted: #777777;
            --muted-light: #a0a0a0;
        }


        /* =====================================================
           BASE
           ===================================================== */

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(244, 200, 66, .095),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(244, 200, 66, .035),
                    transparent 32%
                ),
                #070707;

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND DECORATION
           ===================================================== */

        .background-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            top: -300px;
            left: 50%;
            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(244, 200, 66, .11),
                    rgba(244, 200, 66, .025) 42%,
                    transparent 72%
                );

            pointer-events: none;
        }


        .background-ring {
            position: fixed;
            width: 650px;
            height: 650px;
            right: -450px;
            bottom: -430px;

            border: 1px solid rgba(244, 200, 66, .035);
            border-radius: 50%;

            pointer-events: none;
        }


        /* =====================================================
           LOGIN WRAPPER
           ===================================================== */

        .login-wrapper {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 440px;
        }


        /* =====================================================
           BRAND
           ===================================================== */

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }


        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 48px;
            height: 48px;

            margin-bottom: 16px;

            border: 1px solid var(--border-gold);
            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    rgba(244, 200, 66, .09),
                    rgba(244, 200, 66, .025)
                );

            color: var(--gold);

            font-size: 17px;
            font-weight: 950;

            box-shadow:
                0 12px 35px rgba(244, 200, 66, .07),
                inset 0 1px 0 rgba(255,255,255,.035);
        }


        .brand a {
            color: var(--text);
            text-decoration: none;
        }


        .brand h1 {
            margin: 0;

            font-size: 34px;
            line-height: 1;

            font-weight: 950;

            letter-spacing: -1.9px;
        }


        .brand h1 span {
            color: rgba(255,255,255,.42);
        }


        .brand p {
            margin: 10px 0 0;

            color: #777777;

            font-size: 11px;
            line-height: 1.5;

            letter-spacing: .35px;
        }


        /* =====================================================
           ADMIN BADGE
           ===================================================== */

        .admin-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            margin-top: 14px;

            padding: 7px 11px;

            border: 1px solid rgba(244, 200, 66, .17);
            border-radius: 999px;

            background: rgba(244, 200, 66, .045);

            color: #d7bd5c;

            font-size: 8px;
            font-weight: 950;

            letter-spacing: .9px;
            text-transform: uppercase;
        }


        .admin-label::before {
            content: "";

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--gold);

            box-shadow:
                0 0 8px rgba(244, 200, 66, .65);
        }


        /* =====================================================
           LOGIN CARD
           ===================================================== */

        .login-box {
            position: relative;

            width: 100%;

            padding: 30px;

            border: 1px solid rgba(255,255,255,.075);
            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.035),
                    rgba(255,255,255,.008)
                ),
                rgba(13,13,13,.94);

            box-shadow:
                0 30px 90px rgba(0,0,0,.55),
                0 10px 30px rgba(0,0,0,.25),
                inset 0 1px 0 rgba(255,255,255,.025);

            backdrop-filter: blur(18px);
        }


        .login-box::before {
            content: "";

            position: absolute;

            top: 0;
            left: 28px;
            right: 28px;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(244,200,66,.42),
                    transparent
                );

            opacity: .7;
        }


        /* =====================================================
           SECURITY HEADER
           ===================================================== */

        .security-header {
            display: flex;
            align-items: center;
            gap: 11px;

            margin-bottom: 25px;
            padding-bottom: 19px;

            border-bottom: 1px solid rgba(255,255,255,.055);
        }


        .security-icon {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 34px;
            height: 34px;

            flex-shrink: 0;

            border: 1px solid rgba(244,200,66,.14);
            border-radius: 9px;

            background: rgba(244,200,66,.035);

            color: var(--gold);

            font-size: 13px;
            font-weight: 900;
        }


        .security-title {
            color: #dddddd;

            font-size: 10px;
            font-weight: 850;

            letter-spacing: .25px;
        }


        .security-subtitle {
            margin-top: 3px;

            color: #5f5f5f;

            font-size: 8px;
        }


        /* =====================================================
           ERROR
           ===================================================== */

        .error {
            display: flex;
            align-items: flex-start;
            gap: 10px;

            margin-bottom: 20px;
            padding: 13px 14px;

            border: 1px solid rgba(248,113,113,.17);
            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    rgba(248,113,113,.065),
                    rgba(255,255,255,.008)
                );

            color: #efaaaa;

            font-size: 10px;
            line-height: 1.5;
        }


        .error-icon {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 21px;
            height: 21px;

            flex-shrink: 0;

            border-radius: 50%;

            background: rgba(248,113,113,.09);

            color: #f87171;

            font-size: 9px;
            font-weight: 950;
        }


        /* =====================================================
           FORM
           ===================================================== */

        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 8px;

            color: #c9c9c9;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: .15px;
        }


        .label-required {
            color: #626262;

            font-size: 8px;
            font-weight: 600;
        }


        .input-wrapper {
            position: relative;
        }


        .input-icon {
            position: absolute;

            left: 13px;
            top: 50%;

            transform: translateY(-50%);

            color: #5f5f5f;

            font-size: 11px;

            pointer-events: none;
        }


        input {
            width: 100%;

            height: 47px;

            padding: 0 13px 0 37px;

            border: 1px solid rgba(255,255,255,.085);
            border-radius: 9px;

            outline: none;

            background:
                rgba(5,5,5,.72);

            color: #ffffff;

            font-family: inherit;
            font-size: 11px;

            transition:
                border-color .18s ease,
                box-shadow .18s ease,
                background .18s ease;
        }


        input::placeholder {
            color: #4d4d4d;
        }


        input:hover {
            border-color: rgba(255,255,255,.13);
        }


        input:focus {
            border-color: rgba(244,200,66,.42);

            background:
                rgba(8,8,8,.92);

            box-shadow:
                0 0 0 3px rgba(244,200,66,.055),
                0 8px 20px rgba(0,0,0,.12);
        }


        input:focus + .input-focus-line {
            opacity: 1;
        }


        .input-focus-line {
            position: absolute;

            left: 14px;
            right: 14px;
            bottom: -1px;

            height: 1px;

            border-radius: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold),
                    transparent
                );

            opacity: 0;

            transition: opacity .18s ease;

            pointer-events: none;
        }


        /* =====================================================
           PASSWORD INPUT
           ===================================================== */

        input[type="password"] {
            letter-spacing: 1px;
        }


        /* =====================================================
           LOGIN BUTTON
           ===================================================== */

        .login-button {
            position: relative;

            width: 100%;
            height: 48px;

            margin-top: 5px;

            border: 1px solid rgba(255,255,255,.13);
            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--gold-light),
                    var(--gold),
                    var(--gold-dark)
                );

            color: #080808;

            font-family: inherit;

            font-size: 10px;
            font-weight: 950;

            letter-spacing: .5px;
            text-transform: uppercase;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(244,200,66,.10);

            transition:
                transform .18s ease,
                filter .18s ease,
                box-shadow .18s ease;
        }


        .login-button:hover {
            transform: translateY(-1px);

            filter: brightness(1.06);

            box-shadow:
                0 14px 32px rgba(244,200,66,.16);
        }


        .login-button:active {
            transform: translateY(0);
        }


        .login-button::after {
            content: "→";

            margin-left: 8px;

            font-size: 12px;
        }


        /* =====================================================
           SECURITY NOTICE
           ===================================================== */

        .security-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            margin-top: 16px;

            color: #4f4f4f;

            font-size: 8px;
            line-height: 1.5;

            text-align: center;
        }


        .security-notice span {
            color: #777;
        }


        /* =====================================================
           NAVIGATION
           ===================================================== */

        .back {
            text-align: center;

            margin-top: 20px;
        }


        .back a {
            color: #777;

            text-decoration: none;

            font-size: 10px;
            font-weight: 650;

            transition: color .18s ease;
        }


        .back a:hover {
            color: var(--gold);
        }


        .home {
            text-align: center;

            margin-top: 11px;
        }


        .home a {
            color: #4f4f4f;

            text-decoration: none;

            font-size: 9px;

            transition: color .18s ease;
        }


        .home a:hover {
            color: #999;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .login-footer {
            margin-top: 22px;

            text-align: center;

            color: #3f3f3f;

            font-size: 8px;
            letter-spacing: .15px;
        }


        .login-footer strong {
            color: #666;
            font-weight: 800;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 520px) {

            body {
                padding: 25px 14px;
            }

            .login-box {
                padding: 24px 20px;
                border-radius: 15px;
            }

            .brand h1 {
                font-size: 30px;
            }

            .brand-mark {
                width: 43px;
                height: 43px;
                margin-bottom: 14px;
            }

            .security-header {
                margin-bottom: 21px;
            }

        }


        @media (max-width: 360px) {

            .login-box {
                padding: 21px 16px;
            }

            .brand h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<div class="background-glow"></div>

<div class="background-ring"></div>


<div class="login-wrapper">


    <!-- =====================================================
         BRAND
         ===================================================== -->

    <div class="brand">

        <div class="brand-mark">
            BH
        </div>


        <a href="/">

            <h1>
                BEAT<span>HUB</span>
            </h1>

        </a>


        <p>
            Administrator Portal
        </p>


        <div class="admin-label">
            Secure Admin Access
        </div>

    </div>


    <!-- =====================================================
         LOGIN CARD
         ===================================================== -->

    <div class="login-box">


        <div class="security-header">

            <div class="security-icon">
                ◆
            </div>

            <div>

                <div class="security-title">
                    Administrator Authentication
                </div>

                <div class="security-subtitle">
                    Authorized personnel only
                </div>

            </div>

        </div>


        <!-- =================================================
             ERROR
             ================================================= -->

        {% if error %}

            <div class="error">

                <div class="error-icon">
                    !
                </div>

                <div>
                    {{ error }}
                </div>

            </div>

        {% endif %}


        <!-- =================================================
             LOGIN FORM
             ================================================= -->

        <form
            method="post"
            action="/admin/login"
        >


            <!-- EMAIL -->

            <div class="form-group">

                <label for="identifier">

                    <span>
                        Administrator Email
                    </span>

                    <span class="label-required">
                        REQUIRED
                    </span>

                </label>


                <div class="input-wrapper">

                    <span class="input-icon">
                        @
                    </span>

                    <input
                        type="email"
                        id="identifier"
                        name="identifier"
                        placeholder="admin@beathub.com"
                        required
                        autocomplete="username"
                        autofocus
                    >

                    <div class="input-focus-line"></div>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    <span>
                        Password
                    </span>

                    <span class="label-required">
                        REQUIRED
                    </span>

                </label>


                <div class="input-wrapper">

                    <span class="input-icon">
                        ●
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your admin password"
                        required
                        autocomplete="current-password"
                    >

                    <div class="input-focus-line"></div>

                </div>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-button"
            >
                Sign In to Admin
            </button>


        </form>


        <div class="security-notice">
            <span>◆</span>
            Protected BeatHub administrator environment
        </div>


    </div>


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <div class="back">

        <a href="/login">
            ← Back to BeatHub Login
        </a>

    </div>


    <div class="home">

        <a href="/">
            Back to BeatHub Home
        </a>

    </div>


    <div class="login-footer">

        <strong>BEATHUB</strong>
        · Administrator Access

    </div>


</div>


</body>

</html>
