<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BeatHub — Administrator Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: #09090b;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: #111113;
            border: 1px solid #27272a;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand a {
            color: #ffffff;
            text-decoration: none;
        }

        .brand h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: -1px;
        }

        .brand p {
            margin: 9px 0 0;
            color: #a1a1aa;
            font-size: 14px;
        }

        .admin-label {
            display: inline-block;
            margin-top: 14px;
            padding: 5px 10px;
            border-radius: 999px;
            background: #27272a;
            color: #d4d4d8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .error {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #3f1515;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            font-size: 14px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #d4d4d8;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 9px;
            border: 1px solid #3f3f46;
            background: #18181b;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        input::placeholder {
            color: #71717a;
        }

        input:focus {
            border-color: #a1a1aa;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #ffffff;
            color: #09090b;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .back {
            text-align: center;
            margin-top: 21px;
        }

        .back a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 14px;
        }

        .back a:hover {
            color: #ffffff;
        }

        .home {
            text-align: center;
            margin-top: 10px;
        }

        .home a {
            color: #71717a;
            text-decoration: none;
            font-size: 13px;
        }

        .home a:hover {
            color: #ffffff;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="brand">

        <a href="/">
            <h1>
                BEAT<span style="opacity:0.55;">HUB</span>
            </h1>
        </a>

        <p>
            Administrator Portal
        </p>

        <div class="admin-label">
            Secure Admin Access
        </div>

    </div>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form
        method="post"
        action="/admin/login"
    >

        <div class="form-group">

            <label for="identifier">
                Administrator Email
            </label>

            <input
                type="email"
                id="identifier"
                name="identifier"
                placeholder="admin@beathub.com"
                required
                autocomplete="username"
                autofocus
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your admin password"
                required
                autocomplete="current-password"
            >

        </div>

        <button
            type="submit"
            class="login-button"
        >
            Sign In to Admin
        </button>

    </form>

    <div class="back">

        <a href="/login">
            ← Back to BeatHub Login
        </a>

    </div>

    <div class="home">

        <a href="/">
            Back to BeatHub Home
        </a>

    </div>

</div>

</body>
</html>
