{% extends "base.html" %}
{% block title %}Login — BeatHub{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <div class="brand">BEAT<span class="hub">HUB</span></div>
    <h2>The Home of Cool Beats &amp; Dope Tracks</h2>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <form action="/login" method="post">
      <div class="field">
        <label>Email or Producer Name</label>
        <input type="text" name="identifier" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember" style="margin:0;text-transform:none;">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="sub" style="margin-top:18px;">
      <a href="/forgot-password" style="color:var(--teal);">Forgot your password?</a>
    </p>
    <p class="sub">
      New to BeatHub? <a href="/signup" style="color:var(--gold);">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
