<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BeatHub — Login</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #09090b;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            padding: 36px;
            background: #111113;
            border: 1px solid #27272a;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand a {
            color: #ffffff;
            text-decoration: none;
        }

        .brand h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: -1px;
        }

        .brand .hub {
            opacity: 0.55;
        }

        .brand p {
            margin: 9px 0 0;
            color: #a1a1aa;
            font-size: 15px;
        }

        .error {
            margin-bottom: 20px;
            padding: 13px 14px;
            border-radius: 9px;
            background: #3f1515;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            font-size: 14px;
            line-height: 1.4;
        }

        .success {
            margin-bottom: 20px;
            padding: 13px 14px;
            border-radius: 9px;
            background: #132e1b;
            border: 1px solid #166534;
            color: #86efac;
            font-size: 14px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #d4d4d8;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 9px;
            border: 1px solid #3f3f46;
            background: #18181b;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        input::placeholder {
            color: #71717a;
        }

        input:focus {
            border-color: #a1a1aa;
        }

        .password-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .password-row label {
            margin-bottom: 0;
        }

        .forgot {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot:hover {
            color: #ffffff;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 4px;
            border: 0;
            border-radius: 9px;
            background: #ffffff;
            color: #09090b;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .signup-link {
            text-align: center;
            margin-top: 23px;
            color: #a1a1aa;
            font-size: 14px;
        }

        .signup-link a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 18px;
        }

        .back-home a {
            color: #71717a;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home a:hover {
            color: #ffffff;
        }

    </style>

</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="brand">

            <a href="/">
                <h1>
                    BEAT<span class="hub">HUB</span>
                </h1>
            </a>

            <p>
                Welcome back to BeatHub
            </p>

        </div>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        {% if request.query_params.get('success') %}

            <div class="success">
                {{ request.query_params.get('success') }}
            </div>

        {% endif %}

        <form
            method="post"
            action="/login"
        >

            <div class="form-group">

                <label for="identifier">
                    Email address
                </label>

                <input
                    type="email"
                    id="identifier"
                    name="identifier"
                    placeholder="you@example.com"
                    required
                    autocomplete="username"
                    autofocus
                >

            </div>

            <div class="form-group">

                <div class="password-row">

                    <label for="password">
                        Password
                    </label>

                    <a
                        href="/forgot-password"
                        class="forgot"
                    >
                        Forgot password?
                    </a>

                </div>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>

        <div class="signup-link">

            Don't have an account?

            <a href="/signup">
                Create an account
            </a>

        </div>

        <div class="back-home">

            <a href="/">
                ← Back to BeatHub
            </a>

        </div>

    </div>

</div>

</body>
</html>
