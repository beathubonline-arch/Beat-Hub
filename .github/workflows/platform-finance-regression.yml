name: BeatHub Platform Finance Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  platform-finance-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile financial code
        run: python -m compileall -q app tests

      - name: Platform finance test pass 1
        run: python -m unittest tests.test_platform_finance -v

      - name: Platform finance test pass 2
        run: python -m unittest tests.test_platform_finance -v
