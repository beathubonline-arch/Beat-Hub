name: BeatHub validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./validation.db
      APP_ENV: development
      SESSION_SECRET: validation-secret
      SECRET_KEY: validation-secret
      BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q main.py app
      - name: Import application and inspect routes
        run: python -c "import main; print('BeatHub import OK'); print('Routes:', len(main.app.routes))"
