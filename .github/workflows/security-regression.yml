name: BeatHub Security Regression

on:
  push:
    branches: [main, security/auth-session-hardening, security/csrf-hardening-step2, security/email-delivery-failure-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  email-sender-hardening:
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'Implement dedicated transactional email senders')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply dedicated email sender routing
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path("app/config.py")
          text = config.read_text()
          old = '''    EMAIL_ENABLED: bool = False\n    EMAIL_PROVIDER: str = "resend"\n    EMAIL_FROM: str = ""\n    RESEND_API_KEY: str = ""\n    RESEND_FROM: str = ""\n'''
          new = '''    EMAIL_ENABLED: bool = False\n    EMAIL_PROVIDER: str = "resend"\n    EMAIL_FROM: str = ""\n    RESEND_API_KEY: str = ""\n    RESEND_FROM: str = ""\n    # Dedicated transactional identities under the verified BeatHub domain.\n    EMAIL_VERIFICATION_FROM: str = "BeatHub <no-reply@mybeathub.com>"\n    PASSWORD_RESET_FROM: str = "BeatHub Password Reset <reset-password@mybeathub.com>"\n    SUPPORT_EMAIL: str = "support@mybeathub.com"\n'''
          if old not in text:
              raise SystemExit("Expected email configuration block not found")
          config.write_text(text.replace(old, new, 1))

          auth = Path("app/routers/auth.py")
          text = auth.read_text()
          old = '''def _send_email_resend(to_email: str, subject: str, body: str) -> bool:\n    api_key = str(getattr(settings, "RESEND_API_KEY", "") or "").strip()\n    sender = str(getattr(settings, "RESEND_FROM", "") or getattr(settings, "EMAIL_FROM", "") or "").strip()\n    if not api_key or not sender:\n        logger.error("Resend email delivery is misconfigured: RESEND_API_KEY or RESEND_FROM is missing.")\n        return False\n    payload = {"from": sender, "to": [to_email], "subject": subject, "text": body}\n    headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json", "User-Agent": RESEND_USER_AGENT}\n    try:\n        with httpx.Client(timeout=15.0) as client:\n            response = client.post(RESEND_API_URL, json=payload, headers=headers)\n        if 200 <= response.status_code < 300:\n            logger.info("Email sent successfully through Resend.")\n            return True\n        error_name = ""\n        error_message = ""\n        try:\n            error_data = response.json()\n            if isinstance(error_data, dict):\n                error_name = str(error_data.get("name", ""))[:120]\n                error_message = str(error_data.get("message", ""))[:240]\n        except ValueError:\n            pass\n        if error_name or error_message:\n            logger.error("Resend email delivery failed with HTTP %s (%s): %s", response.status_code, error_name, error_message)\n        else:\n            logger.error("Resend email delivery failed with HTTP %s.", response.status_code)\n    except (httpx.TimeoutException, httpx.NetworkError) as exc:\n        logger.error("Resend network/timeout error: %s", type(exc).__name__)\n    except httpx.HTTPError as exc:\n        logger.error("Resend HTTP error: %s", type(exc).__name__)\n    except Exception as exc:\n        logger.error("Unexpected Resend delivery error: %s", type(exc).__name__)\n    return False\n\n\ndef _send_email(to_email: str, subject: str, body: str) -> bool:\n    if not bool(getattr(settings, "EMAIL_ENABLED", False)):\n        logger.warning("Email delivery disabled by EMAIL_ENABLED.")\n        return False\n    provider = str(getattr(settings, "EMAIL_PROVIDER", "resend") or "resend").strip().lower()\n    if provider == "resend": return _send_email_resend(to_email, subject, body)\n    logger.error("Unsupported email provider: %s", provider)\n    return False\n\n\ndef _send_verification_email(email: str, code: str) -> bool:\n    return _send_email(email, "Verify your BeatHub email", "Welcome to BeatHub.\\n\\n" f"Your verification code is: {code}\\n\\n" "This code expires in 10 minutes and can only be used once.\\n\\n" "If you did not create this account, you can ignore this email.")\n\n\ndef _send_password_reset_email(email: str, reset_url: str) -> bool:\n    return _send_email(email, "BeatHub password reset", "We received a request to reset your BeatHub password.\\n\\n" f"Use this link within 1 hour:\\n{reset_url}\\n\\n" "If you did not request this, you can safely ignore this email.")\n'''
          new = '''def _send_email_resend(to_email: str, subject: str, body: str, sender: str | None = None, reply_to: str | None = None) -> bool:\n    api_key = str(getattr(settings, "RESEND_API_KEY", "") or "").strip()\n    sender = str(sender or getattr(settings, "RESEND_FROM", "") or getattr(settings, "EMAIL_FROM", "") or "").strip()\n    if not api_key or not sender:\n        logger.error("Resend email delivery is misconfigured: RESEND_API_KEY or sender is missing.")\n        return False\n    payload = {"from": sender, "to": [to_email], "subject": subject, "text": body}\n    if reply_to:\n        payload["reply_to"] = reply_to\n    headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json", "User-Agent": RESEND_USER_AGENT}\n    try:\n        with httpx.Client(timeout=15.0) as client:\n            response = client.post(RESEND_API_URL, json=payload, headers=headers)\n        if 200 <= response.status_code < 300:\n            logger.info("Email sent successfully through Resend from configured transactional sender.")\n            return True\n        error_name = ""\n        error_message = ""\n        try:\n            error_data = response.json()\n            if isinstance(error_data, dict):\n                error_name = str(error_data.get("name", ""))[:120]\n                error_message = str(error_data.get("message", ""))[:240]\n        except ValueError:\n            pass\n        if error_name or error_message:\n            logger.error("Resend email delivery failed with HTTP %s (%s): %s", response.status_code, error_name, error_message)\n        else:\n            logger.error("Resend email delivery failed with HTTP %s.", response.status_code)\n    except (httpx.TimeoutException, httpx.NetworkError) as exc:\n        logger.error("Resend network/timeout error: %s", type(exc).__name__)\n    except httpx.HTTPError as exc:\n        logger.error("Resend HTTP error: %s", type(exc).__name__)\n    except Exception as exc:\n        logger.error("Unexpected Resend delivery error: %s", type(exc).__name__)\n    return False\n\n\ndef _send_email(to_email: str, subject: str, body: str, sender: str | None = None, reply_to: str | None = None) -> bool:\n    if not bool(getattr(settings, "EMAIL_ENABLED", False)):\n        logger.warning("Email delivery disabled by EMAIL_ENABLED.")\n        return False\n    provider = str(getattr(settings, "EMAIL_PROVIDER", "resend") or "resend").strip().lower()\n    if provider == "resend": return _send_email_resend(to_email, subject, body, sender=sender, reply_to=reply_to)\n    logger.error("Unsupported email provider: %s", provider)\n    return False\n\n\ndef _send_verification_email(email: str, code: str) -> bool:\n    sender = str(getattr(settings, "EMAIL_VERIFICATION_FROM", "") or "BeatHub <no-reply@mybeathub.com>").strip()\n    return _send_email(email, "Verify your BeatHub email", "Welcome to BeatHub.\\n\\n" f"Your verification code is: {code}\\n\\n" "This code expires in 10 minutes and can only be used once.\\n\\n" "If you did not create this account, you can ignore this email.", sender=sender)\n\n\ndef _send_password_reset_email(email: str, reset_url: str) -> bool:\n    sender = str(getattr(settings, "PASSWORD_RESET_FROM", "") or "BeatHub Password Reset <reset-password@mybeathub.com>").strip()\n    reply_to = str(getattr(settings, "SUPPORT_EMAIL", "") or "support@mybeathub.com").strip()\n    return _send_email(email, "BeatHub password reset", "We received a request to reset your BeatHub password.\\n\\n" f"Use this link within 1 hour:\\n{reset_url}\\n\\n" "If you did not request this, you can safely ignore this email.", sender=sender, reply_to=reply_to)\n'''
          if old not in text:
              raise SystemExit("Expected Resend email block not found")
          auth.write_text(text.replace(old, new, 1))
          PY
          cat > tests/test_email_sender_routing.py <<'EOF'
          import unittest
          from unittest.mock import patch
          from app.routers import auth

          class EmailSenderRoutingTests(unittest.TestCase):
              def test_verification_uses_no_reply_sender(self):
                  with patch.object(auth, "_send_email", return_value=True) as send:
                      self.assertTrue(auth._send_verification_email("user@example.com", "123456"))
                  self.assertEqual(send.call_args.kwargs["sender"], "BeatHub <no-reply@mybeathub.com>")
                  self.assertNotIn("reply_to", send.call_args.kwargs)

              def test_password_reset_uses_reset_sender_and_support_reply_to(self):
                  with patch.object(auth, "_send_email", return_value=True) as send:
                      self.assertTrue(auth._send_password_reset_email("user@example.com", "https://mybeathub.com/reset-password?token=test"))
                  self.assertEqual(send.call_args.kwargs["sender"], "BeatHub Password Reset <reset-password@mybeathub.com>")
                  self.assertEqual(send.call_args.kwargs["reply_to"], "support@mybeathub.com")

          if __name__ == "__main__":
              unittest.main()
          EOF
      - name: Compile application
        run: python -m compileall -q app tests
      - name: Run email routing tests
        run: python -m unittest tests.test_email_sender_routing -v
      - name: Run existing authorization regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit tested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/config.py app/routers/auth.py tests/test_email_sender_routing.py
          git commit -m "Implement dedicated transactional email senders"
          git push

  authorization-tests:
    if: "github.ref != 'refs/heads/main' || contains(github.event.head_commit.message, 'Implement dedicated transactional email senders')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app tests
      - name: Run authorization regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
