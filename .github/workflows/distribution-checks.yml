name: BeatHub Distribution checks
on:
  push:
    branches: [feature/beathub-distribution-mvp]
  pull_request:
    paths:
      - "distribution/**"
      - ".github/workflows/distribution-checks.yml"
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest==8.4.1" "sqlalchemy==2.0.36"
      - name: Compile distribution modules
        run: python -m compileall -q distribution
      - name: Test twice
        run: |
          python -m pytest -q distribution
          python -m pytest -q distribution
