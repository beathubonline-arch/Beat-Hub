name: BeatHub Admin Email Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  admin-email-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Run admin email regression tests
        run: python -m unittest tests.test_admin_email_notifications -v
