name: BeatHub Growth Agent Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  growth-agent-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile growth code
        run: python -m compileall -q app tests/test_growth_agent_v1.py tests/test_growth_funnel_v2.py tests/test_growth_model_import.py tests/test_growth_campaign_v3.py tests/test_growth_worker_v4.py
      - name: Import application
        run: python -c "import main; print('BeatHub application import OK')"
      - name: Growth regression pass 1
        run: pytest -q tests/test_growth_agent_v1.py tests/test_growth_funnel_v2.py tests/test_growth_model_import.py tests/test_growth_campaign_v3.py tests/test_growth_worker_v4.py
      - name: Growth regression pass 2
        run: pytest -q tests/test_growth_agent_v1.py tests/test_growth_funnel_v2.py tests/test_growth_model_import.py tests/test_growth_campaign_v3.py tests/test_growth_worker_v4.py
