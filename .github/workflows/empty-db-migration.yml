name: BeatHub Empty PostgreSQL Migration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  empty-db-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beathub_test
          POSTGRES_PASSWORD: beathub_test
          POSTGRES_DB: beathub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U beathub_test -d beathub_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic from an empty PostgreSQL database
        env:
          DATABASE_URL: postgresql+psycopg://beathub_test:beathub_test@127.0.0.1:5432/beathub_test
        run: alembic upgrade head
