name: Marketplace Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  marketplace-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app main.py tests

      - name: Marketplace regression pass 1
        run: python -m unittest tests.test_music_content_types tests.test_track_marketplace

      - name: Marketplace regression pass 2
        run: python -m unittest tests.test_music_content_types tests.test_track_marketplace
