name: Temporary Paystack Connection Check
on:
  push:
    branches: [mkulima-ai-deploy]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Mkulima Paystack secret presence
        run: |
          set -euo pipefail
          body="$(curl -fsS https://mkulima-ai-whatsapp.onrender.com/api/health)"
          echo "$body"
          python - <<'PY' "$body"
          import json,sys
          data=json.loads(sys.argv[1])
          assert data["payments"]["configured"] is True, data
          print("MKULIMA_PAYSTACK_CONFIGURED=true")
          PY
      - name: Check Mizizi Paystack secret presence
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/mz.out -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://beixlzqbuascruzhcety.supabase.co/functions/v1/mizizi-paystack-webhook)"
          echo "MIZIZI_UNSIGNED_WEBHOOK_HTTP=$code"
          cat /tmp/mz.out || true
          test "$code" = "401"
          echo "MIZIZI_PAYSTACK_CONFIGURED=true"
