name: Temporary Mizizi DB Path Check
on:
  push:
    branches: [mizizi-live]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check payment DB path twice
        run: |
          set -euo pipefail
          for n in 1 2; do
            body="$(curl -fsS -X POST https://beixlzqbuascruzhcety.supabase.co/functions/v1/mizizi-db-diagnostic)"
            echo "RUN_$n=$body"
            python - <<'PY' "$body"
          import json,sys
          data=json.loads(sys.argv[1])
          assert data.get("ok") is True, data
          row=data["row"]
          assert row["plan"]=="Done-for-You Family Legacy", row
          assert row["amount_kes"]==5000, row
          assert row["status"]=="initialized", row
          PY
          done
