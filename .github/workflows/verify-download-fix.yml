name: Verify download fix

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install syntax dependencies
        run: python -m pip install --disable-pip-version-check fastapi sqlalchemy pydantic-settings jinja2
      - name: Compile changed Python files
        run: python -m py_compile app/routers/pages.py app/services/r2_download.py
      - name: Verify route and helper wiring
        run: |
          grep -q 'r2_download_url' app/routers/pages.py
          grep -q 'def r2_download_url' app/services/r2_download.py
          grep -q '/account/download/{track_id}' app/routers/pages.py
          echo 'Download route wiring verified.'
