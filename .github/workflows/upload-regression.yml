name: BeatHub Upload Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  upload-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app main.py
      - name: Upload validation pass 1
        run: pytest -q tests/test_storage_upload_validation.py
      - name: Upload validation pass 2
        run: pytest -q tests/test_storage_upload_validation.py
