name: BeatHub Audio Preview Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/routers/audio_preview.py"
      - "main.py"
      - "tests/audio_preview_security_test.py"
      - ".github/workflows/audio-preview-regression.yml"
      - "requirements.txt"
  push:
    branches:
      - main
    paths:
      - "app/routers/audio_preview.py"
      - "main.py"
      - "tests/audio_preview_security_test.py"
      - ".github/workflows/audio-preview-regression.yml"
      - "requirements.txt"

jobs:
  audio-preview-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app main.py tests

      - name: Audio preview security pass 1
        run: python -m unittest tests.audio_preview_security_test -v

      - name: Audio preview security pass 2
        run: python -m unittest tests.audio_preview_security_test -v
