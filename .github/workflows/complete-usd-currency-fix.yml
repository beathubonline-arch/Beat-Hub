name: Complete USD Product Currency Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch currency handling and displays
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != expected:
                  raise SystemExit(f'{path}: expected {expected} replacements, found {n}')
              p.write_text(s.replace(old, new))
              print(f'patched {path}: {n}')

          # Backend: accept and persist the currency selected on the upload form.
          replace(
              'app/routers/dashboard.py',
              'from app.models.music import Album, AlbumTrack, SalesModel, Track',
              'from app.models.music import Album, AlbumTrack, ProductCurrency, SalesModel, Track',
          )
          replace(
              'app/routers/dashboard.py',
              '    prices: List[str] = Form(...),\n    sales_models: List[str] = Form(...),',
              '    prices: List[str] = Form(...),\n    currencies: List[str] = Form(...),\n    sales_models: List[str] = Form(...),',
          )
          replace(
              'app/routers/dashboard.py',
              '            model_raw = (\n                sales_models[i]\n                if i < len(sales_models)\n                else "non_exclusive"\n            )',
              '            currency_raw = (\n                currencies[i].strip().upper()\n                if i < len(currencies)\n                else ProductCurrency.KES.value\n            )\n\n            if currency_raw not in {ProductCurrency.KES.value, ProductCurrency.USD.value}:\n                return error(\n                    f"Currency for \'{title}\' must be KES or USD."\n                )\n\n            model_raw = (\n                sales_models[i]\n                if i < len(sales_models)\n                else "non_exclusive"\n            )',
          )
          replace(
              'app/routers/dashboard.py',
              '                price=price_value,\n                sales_model=sales_model,',
              '                price=price_value,\n                currency=currency_raw,\n                sales_model=sales_model,',
          )

          # Creator dashboard: show the actual stored currency, not hard-coded KSh.
          replace(
              'app/templates/dashboard.html',
              "{{ track.genre|default('Uncategorized') }}{% if track.price is defined and track.price is not none %} · KSh {{ track.price }}{% endif %}",
              "{{ track.genre|default('Uncategorized') }}{% if track.price is defined and track.price is not none %} · {{ '$' if (track.currency|default('KES')) == 'USD' else 'KSh' }} {{ '%.2f'|format(track.price|float) }} {{ track.currency|default('KES') }}{% endif %}",
          )

          # Marketplace cards: show KSh or USD consistently.
          replace(
              'app/templates/beats.html',
              "                    KSh {{ '%.2f'|format(item.price or 0) }}",
              "                    {{ '$' if (item.track.currency|default('KES')) == 'USD' else 'KSh' }} {{ '%.2f'|format(item.price or 0) }} {{ item.track.currency|default('KES') }}",
          )

          # Creator public store: both beats and finished tracks use their product currency.
          replace(
              'app/templates/creator_store.html',
              "<span class=\"price\">KSh {{ '%.2f'|format(track.price or 0) }}</span>",
              "<span class=\"price\">{{ '$' if (track.currency|default('KES')) == 'USD' else 'KSh' }} {{ '%.2f'|format(track.price or 0) }} {{ track.currency|default('KES') }}</span>",
              expected=2,
          )

          # Music catalog context: explicitly expose currency to templates/API consumers.
          replace(
              'app/routers/music.py',
              '        "price": _track_price(track),\n        "artwork_url": _track_artwork(track),',
              '        "price": _track_price(track),\n        "currency": str(_model_value(track, "currency", default="KES") or "KES").upper(),\n        "artwork_url": _track_artwork(track),',
          )
          PY

      - name: Validate Python files
        run: |
          python -m py_compile app/routers/dashboard.py app/routers/music.py app/routers/paystack_checkout.py

      - name: Commit and push
        run: |
          git config user.name 'BeatHub Automation'
          git config user.email 'beathubonline@gmail.com'
          git add app/routers/dashboard.py app/routers/music.py app/templates/dashboard.html app/templates/beats.html app/templates/creator_store.html
          git commit -m 'fix: persist and display USD product currency' || exit 0
          git push origin main

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/complete-usd-currency-fix.yml
          git commit -m 'chore: remove temporary USD fix workflow'
          git push origin main
