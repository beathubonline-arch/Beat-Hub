name: Implement admin email notifications
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch notification hooks
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'pattern not found in {path}')
              p.write_text(s.replace(old,new,1))

          replace('app/routers/auth.py', 'from app.utils.security import create_access_token, hash_password, verify_password\n', 'from app.utils.security import create_access_token, hash_password, verify_password\nfrom app.services.admin_notifications import notify_new_user\n')
          replace('app/routers/auth.py', '    if not _send_verification_email(email_norm, verification_code):\n', '    notify_new_user(user)\n    if not _send_verification_email(email_norm, verification_code):\n')
          replace('app/routers/paystack_checkout.py', 'from app.services.pricing import BEATHUB_COMMISSION_PERCENT, calculate_split, normalize_currency\n', 'from app.services.pricing import BEATHUB_COMMISSION_PERCENT, calculate_split, normalize_currency\nfrom app.services.admin_notifications import notify_payment\n')
          replace('app/routers/paystack_checkout.py', '    result = finalize_order(db, order)\n    return result.status == OrderStatus.COMPLETED\n', '    result = finalize_order(db, order)\n    completed = result.status == OrderStatus.COMPLETED\n    if completed:\n        notify_payment(result, "music")\n    return completed\n')
          replace('app/services/merchandise_payments.py', 'from sqlalchemy.orm import Session\n', 'from sqlalchemy.orm import Session\n\nfrom app.services.admin_notifications import notify_admin\n')
          replace('app/services/merchandise_payments.py', '    db.commit()\n    return True\n\n\ndef find_merchandise_order_id', '    db.commit()\n    notify_admin("BeatHub — Payment completed (merchandise)", f"A merchandise payment was successfully verified.\\n\\nOrder ID: {order_id}\\nReference: {reference}\\nAmount: {row[\"total_amount\"]} KES\\n")\n    return True\n\n\ndef find_merchandise_order_id')
          PY
      - name: Verify imports and tests
        run: |
          python -m compileall -q app main.py
          python -m unittest discover -s tests -p 'test_email_sender_routing.py' -v
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git diff --cached --quiet || git commit -m 'Connect admin email notifications to key events'
          git push
