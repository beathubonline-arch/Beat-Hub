name: Repair Paystack merchandise checkout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch merchandise and Paystack routes
        run: |
          python - <<'PY'
          from pathlib import Path

          merch = Path('app/routers/merchandise.py')
          text = merch.read_text()

          # Remove the deleted Daraja module dependency.
          text = text.replace('from app.services import mpesa\n', '')
          text = text.replace('Existing Track, Album, Order, M-Pesa and withdrawal behaviour is untouched.', 'Existing Track, Album, Order and withdrawal behaviour is preserved.')

          start = text.index('# ======================================================================\n# MERCHANDISE PURCHASE HELPERS\n# ======================================================================')
          status_marker = '# ======================================================================\n# MERCHANDISE ORDER STATUS\n# ======================================================================'
          status = text.index(status_marker, start)

          replacement = r'''# ======================================================================
# MERCHANDISE PURCHASE HELPERS
# ======================================================================

def _merch_public_base_url(request: Request) -> str:
    configured = str(os.getenv("APP_BASE_URL", "")).strip().rstrip("/")
    if configured:
        return configured
    return str(request.base_url).rstrip("/")


def _merch_paystack_headers() -> dict:
    return {
        "Authorization": f"Bearer {settings.PAYSTACK_SECRET_KEY}",
        "Content-Type": "application/json",
    }


def _merch_paystack_amount_kobo(amount: Decimal) -> int:
    return int((amount * Decimal("100")).quantize(Decimal("1")))


async def _verify_merch_paystack_reference(reference: str) -> dict:
    if not getattr(settings, "PAYSTACK_SECRET_KEY", None):
        raise RuntimeError("PAYSTACK_SECRET_KEY is not configured.")

    async with httpx.AsyncClient(timeout=30) as client:
        response = await client.get(
            f"{settings.PAYSTACK_BASE_URL}/transaction/verify/{reference}",
            headers=_merch_paystack_headers(),
        )

    response.raise_for_status()
    payload = response.json()
    if not payload.get("status") or not isinstance(payload.get("data"), dict):
        raise RuntimeError(payload.get("message") or "Paystack verification failed.")
    return payload["data"]


def _normalize_merch_quantity(value: str) -> int:
    try:
        quantity = int(str(value or "1").strip())
    except (TypeError, ValueError):
        raise ValueError("Quantity must be a whole number.")

    if quantity < 1 or quantity > MERCH_MAX_QUANTITY:
        raise ValueError(
            f"Quantity must be between 1 and {MERCH_MAX_QUANTITY}."
        )

    return quantity


def _load_merch_product(db: Session, slug: str):
    return db.execute(
        text(
            f"""
            SELECT
                id,
                creator_profile_id,
                name,
                slug,
                description,
                price,
                image_path,
                created_at
            FROM {MERCH_TABLE}
            WHERE slug = :slug
            LIMIT 1
            """
        ),
        {"slug": slug},
    ).mappings().first()


def _merch_order_context(
    request: Request,
    db: Session,
    order_id: str,
):
    row = db.execute(
        text(
            f"""
            SELECT
                o.id,
                o.product_id,
                o.buyer_id,
                o.quantity,
                o.unit_price,
                o.total_amount,
                o.phone_number,
                o.order_note,
                o.status,
                o.merchant_request_id,
                o.checkout_request_id,
                o.mpesa_receipt,
                o.failure_reason,
                o.created_at,
                o.paid_at,
                m.name AS product_name,
                m.slug AS product_slug,
                m.image_path,
                m.description AS product_description
            FROM {MERCH_ORDER_TABLE} o
            JOIN {MERCH_TABLE} m
                ON m.id = o.product_id
            WHERE o.id = :id
            LIMIT 1
            """
        ),
        {"id": str(order_id)},
    ).mappings().first()

    if not row:
        return None

    item = dict(row)
    item["image_url"] = _image_url(request, item.get("image_path"))
    return item


# ======================================================================
# MERCHANDISE CHECKOUT — PAYSTACK ONLY
# ======================================================================

@router.post("/merch/{slug}/buy")
async def buy_merchandise(
    slug: str,
    request: Request,
    db: Session = Depends(get_db),
    user: User = Depends(require_user),
    phone: str = Form(""),
    quantity: str = Form("1"),
    order_note: str = Form(""),
):
    if not getattr(settings, "PAYSTACK_SECRET_KEY", None):
        raise HTTPException(status_code=503, detail="Paystack is not configured yet.")

    ensure_merch_table(db)
    ensure_merch_orders_table(db)

    row = _load_merch_product(db, slug)
    if row is None:
        raise HTTPException(status_code=404, detail="Merchandise item not found.")

    creator_profile = (
        db.query(Profile)
        .filter(Profile.id == str(row["creator_profile_id"]))
        .first()
    )
    if creator_profile and str(creator_profile.user_id) == str(user.id):
        raise HTTPException(status_code=403, detail="You cannot purchase your own merchandise.")

    try:
        quantity_value = _normalize_merch_quantity(quantity)
    except ValueError as exc:
        return RedirectResponse(f"/merch/{slug}?error={quote(str(exc))}", status_code=303)

    note = (order_note or "").strip()
    if len(note) > MERCH_ORDER_NOTE_MAX:
        return RedirectResponse(
            f"/merch/{slug}?error={quote(f'Order note is too long. Keep it under {MERCH_ORDER_NOTE_MAX} characters.')}",
            status_code=303,
        )

    customer_email = (getattr(user, "email", "") or "").strip().lower()
    if not customer_email or "@" not in customer_email:
        return RedirectResponse(
            f"/merch/{slug}?error={quote('A valid account email is required for Paystack checkout.')}",
            status_code=303,
        )

    try:
        unit_price = Decimal(str(row["price"]))
        total_amount = unit_price * Decimal(quantity_value)
    except Exception:
        raise HTTPException(status_code=500, detail="Merchandise price could not be calculated.")

    if total_amount <= Decimal("0"):
        raise HTTPException(status_code=400, detail="Merchandise price must be greater than zero.")

    if total_amount < Decimal("3.00"):
        return RedirectResponse(
            f"/merch/{slug}?error={quote('Paystack requires a minimum payment of KSh 3.00.')}",
            status_code=303,
        )

    order_id = str(uuid4())

    try:
        db.execute(
            text(
                f"""
                INSERT INTO {MERCH_ORDER_TABLE} (
                    id, product_id, buyer_id, quantity, unit_price,
                    total_amount, phone_number, order_note, status
                )
                VALUES (
                    :id, :product_id, :buyer_id, :quantity, :unit_price,
                    :total_amount, :phone_number, :order_note, 'pending_payment'
                )
                """
            ),
            {
                "id": order_id,
                "product_id": str(row["id"]),
                "buyer_id": str(user.id),
                "quantity": quantity_value,
                "unit_price": unit_price,
                "total_amount": total_amount,
                "phone_number": (phone or "paystack")[:32],
                "order_note": note or None,
            },
        )
        db.commit()
    except Exception:
        db.rollback()
        raise

    reference = f"BM{uuid4().hex[:14].upper()}"
    payload = {
        "email": customer_email,
        "amount": str(_merch_paystack_amount_kobo(total_amount)),
        "currency": "KES",
        "reference": reference,
        "callback_url": f"{_merch_public_base_url(request)}/paystack/merchandise/callback",
        "metadata": {
            "beathub_merchandise_order_id": order_id,
            "beathub_product_slug": str(row["slug"]),
            "buyer_id": str(user.id),
        },
    }

    try:
        async with httpx.AsyncClient(timeout=30) as client:
            response = await client.post(
                f"{settings.PAYSTACK_BASE_URL}/transaction/initialize",
                headers=_merch_paystack_headers(),
                json=payload,
            )
        data = response.json()
    except Exception as exc:
        db.execute(
            text(f"UPDATE {MERCH_ORDER_TABLE} SET status='failed', failure_reason=:reason WHERE id=:id"),
            {"reason": str(exc)[:500], "id": order_id},
        )
        db.commit()
        raise HTTPException(status_code=502, detail="Paystack could not be reached. Please try again.")

    if response.status_code >= 400 or not data.get("status"):
        message = str(data.get("message") or "Paystack could not initialize checkout.")
        db.execute(
            text(f"UPDATE {MERCH_ORDER_TABLE} SET status='failed', failure_reason=:reason WHERE id=:id"),
            {"reason": message[:500], "id": order_id},
        )
        db.commit()
        return RedirectResponse(f"/merch/{slug}?error={quote(message)}", status_code=303)

    authorization_url = (data.get("data") or {}).get("authorization_url")
    reference = (data.get("data") or {}).get("reference") or reference
    if not authorization_url:
        db.execute(
            text(f"UPDATE {MERCH_ORDER_TABLE} SET status='failed', failure_reason=:reason WHERE id=:id"),
            {"reason": "Paystack did not return a checkout URL.", "id": order_id},
        )
        db.commit()
        raise HTTPException(status_code=502, detail="Paystack did not return a checkout URL.")

    db.execute(
        text(
            f"""
            UPDATE {MERCH_ORDER_TABLE}
            SET checkout_request_id = :reference,
                merchant_request_id = :access_code
            WHERE id = :id AND status = 'pending_payment'
            """
        ),
        {
            "reference": str(reference),
            "access_code": str((data.get("data") or {}).get("access_code") or "")[:255] or None,
            "id": order_id,
        },
    )
    db.commit()

    return RedirectResponse(authorization_url, status_code=303)


# ======================================================================
# MERCHANDISE ORDER STATUS
# ======================================================================

'''

          text = text[:start] + replacement + text[status + len(status_marker):]

          # Replace the old Daraja callback section, if it still exists.
          callback_start = text.find('# ======================================================================\n# MERCHANDISE M-PESA CALLBACK\n# ======================================================================')
          if callback_start != -1:
              text = text[:callback_start].rstrip() + '\n'

          merch.write_text(text)

          # Add imports required by the Paystack merchandise flow.
          text = merch.read_text()
          text = text.replace('import os\n', 'import os\nimport httpx\n', 1)
          merch.write_text(text)

          # Update the merchandise checkout form to describe Paystack rather than Daraja.
          template = Path('app/templates/merchandise_public.html')
          t = template.read_text()
          t = t.replace('M-Pesa phone', 'Phone number (optional)')
          t = t.replace('Pay with M-Pesa', 'Continue to Paystack')
          t = t.replace('M-Pesa', 'Paystack')
          template.write_text(t)

          # Extend the existing signed Paystack webhook to complete merchandise orders.
          paystack = Path('app/routers/paystack_checkout.py')
          p = paystack.read_text()
          marker = '@router.post("/paystack/webhook")\n'
          helper = r'''
async def _complete_merchandise_webhook(db: Session, data: dict) -> bool:
    metadata = data.get("metadata") or {}
    order_id = metadata.get("beathub_merchandise_order_id")
    if not order_id:
        return False

    status = str(data.get("status") or "").lower()
    if status != "success":
        db.execute(
            text("UPDATE beathub_merchandise_orders SET status='failed', failure_reason=:reason WHERE id=:id AND status='pending_payment'"),
            {"reason": f"Paystack transaction status: {status or 'unknown'}", "id": str(order_id)},
        )
        db.commit()
        return True

    row = db.execute(
        text("SELECT id, total_amount, status FROM beathub_merchandise_orders WHERE id=:id LIMIT 1"),
        {"id": str(order_id)},
    ).mappings().first()
    if not row:
        return True
    if row["status"] == "paid":
        return True

    expected = int((Decimal(str(row["total_amount"])) * Decimal("100")).quantize(Decimal("1")))
    actual = int(data.get("amount") or 0)
    currency = str(data.get("currency") or "").upper()
    if currency != "KES" or actual != expected:
        db.execute(
            text("UPDATE beathub_merchandise_orders SET status='failed', failure_reason=:reason WHERE id=:id AND status='pending_payment'"),
            {"reason": "Paystack verification amount or currency mismatch.", "id": str(order_id)},
        )
        db.commit()
        return True

    receipt = str(data.get("reference") or "")[:128]
    db.execute(
        text("""
            UPDATE beathub_merchandise_orders
            SET status='paid', paid_at=CURRENT_TIMESTAMP,
                mpesa_receipt=COALESCE(mpesa_receipt, :receipt),
                failure_reason=NULL
            WHERE id=:id AND status='pending_payment'
        """),
        {"receipt": receipt, "id": str(order_id)},
    )
    db.commit()
    return True


'''
          if 'async def _complete_merchandise_webhook' not in p:
              p = p.replace(marker, helper + marker, 1)

          # Add text import used by the merchandise webhook helper.
          if 'from sqlalchemy import text\n' not in p:
              p = p.replace('from sqlalchemy.orm import Session\n', 'from sqlalchemy import text\nfrom sqlalchemy.orm import Session\n', 1)

          # Handle merchandise webhook events before normal track PaymentTransaction lookup.
          old = '''    data = payload.get("data") or {}
    reference = data.get("reference")
    if not reference:
        return {"status": True}

    payment = db.query(PaymentTransaction).filter(
'''
          new = '''    data = payload.get("data") or {}

    if await _complete_merchandise_webhook(db, data):
        return {"status": True}

    reference = data.get("reference")
    if not reference:
        return {"status": True}

    payment = db.query(PaymentTransaction).filter(
'''
          if old not in p:
              raise SystemExit('Expected Paystack webhook block was not found')
          p = p.replace(old, new, 1)
          paystack.write_text(p)

          # Validate there are no runtime Daraja imports/routes left in application code.
          import subprocess, sys
          checks = []
          for root in ('app',):
              for path in Path(root).rglob('*.py'):
                  s = path.read_text(errors='ignore')
                  if 'from app.services import mpesa' in s or 'import app.services.mpesa' in s:
                      checks.append(str(path))
          if checks:
              raise SystemExit('Remaining Daraja module imports: ' + ', '.join(checks))

          # Compile the changed Python modules before committing.
          subprocess.run([sys.executable, '-m', 'py_compile', 'app/routers/merchandise.py', 'app/routers/paystack_checkout.py'], check=True)
          print('PATCH_VALIDATED')
          PY

      - name: Verify and commit
        run: |
          git diff --check
          git diff -- app/routers/merchandise.py app/routers/paystack_checkout.py app/templates/merchandise_public.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/merchandise.py app/routers/paystack_checkout.py app/templates/merchandise_public.html
          git commit -m "Remove remaining Daraja dependency from merchandise checkout"
          git push

      - name: Remove one-time repair workflow
        run: |
          git rm .github/workflows/repair-paystack-merchandise.yml
          git commit -m "Remove one-time merchandise repair workflow"
          git push
