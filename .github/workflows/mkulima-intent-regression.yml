name: Mkulima intent regression
on:
  push:
    branches: [mkulima-ai-deploy]
    paths:
      - 'mkulima_ai/**'
      - 'tests/test_mkulima_intent_engine.py'
      - '.github/workflows/mkulima-intent-regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_mkulima_intent_engine -v
