name: BeatHub Paystack Reconciliation Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  paystack-reconciliation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app tests
      - name: Run reconciliation regression suite - pass 1
        run: python -m pytest -q tests/test_paystack_reconciliation.py
      - name: Run reconciliation regression suite - pass 2
        run: python -m pytest -q tests/test_paystack_reconciliation.py
