name: Mkulima feedback regression
on:
  pull_request:
    branches: [mkulima-ai-deploy]
    paths:
      - 'mkulima_ai/**'
      - '.github/workflows/mkulima-feedback-regression.yml'
permissions:
  contents: read
jobs:
  signed-webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.2
      - run: python -m unittest discover -s mkulima_ai -p 'test_feedback*.py' -v
