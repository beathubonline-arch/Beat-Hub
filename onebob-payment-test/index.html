<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OneBob M-PESA Test</title>
<style>
:root{--bg:#0b1611;--card:#102119;--ink:#f5fff8;--muted:#a7b8ad;--green:#25d366;--gold:#f2c94c;--line:#20372b;--danger:#ff6b6b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top right,#18351f 0,#0b1611 48%,#08110d 100%);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{width:min(520px,100%)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--green),var(--gold));display:grid;place-items:center;color:#07120b;font-weight:900;font-size:20px}.brand h1{font-size:24px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:14px}
.card{background:rgba(16,33,25,.94);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 28px 80px rgba(0,0,0,.34)}
.badge{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border-radius:999px;background:#152f20;border:1px solid #285638;font-size:12px;color:#c9f5d8;margin-bottom:18px}
label{display:block;font-size:13px;color:#cbd9d0;margin:15px 0 7px}input{width:100%;border:1px solid #2b4637;background:#0c1812;color:white;padding:14px 15px;border-radius:14px;font-size:16px;outline:none}input:focus{border-color:#44d67a;box-shadow:0 0 0 3px rgba(68,214,122,.12)}
.amount{position:relative}.amount span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#b8c8bd;font-weight:700}.amount input{padding-left:52px}
button{width:100%;margin-top:20px;padding:15px 18px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--green),#63e88f);color:#06120b;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 10px 30px rgba(37,211,102,.20)}button:disabled{opacity:.55;cursor:not-allowed}
.note{margin-top:15px;color:var(--muted);font-size:12px;line-height:1.5}.status{display:none;margin-top:18px;border-radius:16px;padding:16px;border:1px solid var(--line);background:#0b1711}.status.show{display:block}.status strong{display:block;margin-bottom:5px}.ok{border-color:#27633d}.bad{border-color:#6a2e2e}.pending{border-color:#65591f}.small{font-size:12px;color:var(--muted);word-break:break-word}.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:7px;animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.35}}
.footer{margin-top:14px;text-align:center;color:#74867a;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">1B</div><div><h1>OneBob</h1><p>M-PESA sandbox payment test</p></div></div>
  <div class="card">
    <div class="badge">Sandbox only · No real money</div>
    <label for="phone">Safaricom test number</label>
    <input id="phone" inputmode="tel" value="254708374149" autocomplete="tel"/>
    <label for="amount">Amount</label>
    <div class="amount"><span>KSh</span><input id="amount" inputmode="numeric" type="number" min="1" step="1" value="1"/></div>
    <button id="pay">Send M-PESA Prompt</button>
    <div id="status" class="status"></div>
    <div class="note">This page talks directly to OneBob's Daraja sandbox backend. A transaction is only treated as paid after Safaricom sends a successful callback.</div>
  </div>
  <div class="footer">OneBob · secure callback verification · sandbox</div>
</div>
<script>
const API='https://beixlzqbuascruzhcety.supabase.co/functions/v1/onebob-mpesa';
const pay=document.getElementById('pay'), box=document.getElementById('status');
function show(kind,title,msg,ref=''){box.className='status show '+kind;box.innerHTML='<strong>'+title+'</strong><div>'+msg+'</div>'+(ref?'<div class="small" style="margin-top:8px">Reference: '+ref+'</div>':'')}
async function poll(ref){
  for(let i=0;i<24;i++){
    await new Promise(r=>setTimeout(r,5000));
    try{
      const r=await fetch(API+'/status/'+encodeURIComponent(ref));
      const j=await r.json();
      if(j.status==='paid'){show('ok','Payment confirmed','M-PESA payment verified successfully.',ref);pay.disabled=false;pay.textContent='Send Another Test';return}
      if(['failed','cancelled','expired'].includes(j.status)){show('bad','Payment not completed',j.result_desc||j.status,ref);pay.disabled=false;pay.textContent='Try Again';return}
      show('pending','Waiting for M-PESA','Safaricom accepted the request. Waiting for callback…',ref);
    }catch{}
  }
  show('pending','Still waiting','The request is still pending. You can try again after the sandbox callback completes.',ref);pay.disabled=false;pay.textContent='Try Again';
}
pay.onclick=async()=>{
  const phone=document.getElementById('phone').value.trim();
  const amount=Number(document.getElementById('amount').value);
  pay.disabled=true;pay.textContent='Sending…';show('pending','Starting payment','Connecting to Daraja sandbox…');
  try{
    const r=await fetch(API+'/stk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,amount,member_id:'onebob-browser-test'})});
    const j=await r.json();
    if(!r.ok){show('bad','Could not start payment',j.details||j.error||'Request failed');pay.disabled=false;pay.textContent='Try Again';return}
    show('pending','Prompt sent',j.message||'Check the sandbox simulator.',j.reference);
    pay.textContent='Waiting for callback…';
    poll(j.reference);
  }catch(e){
    show('bad','Connection error','Could not reach the OneBob payment backend.');
    pay.disabled=false;pay.textContent='Try Again';
  }
};
</script>
</body>
</html>
