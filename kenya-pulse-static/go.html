<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparing Kenya Pulse AI</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#1d7b4a55,transparent 30%),radial-gradient(circle at 90% 12%,#d4a90030,transparent 28%),linear-gradient(160deg,#04130c,#082b1a 50%,#031008);font-family:Inter,system-ui;color:#f7fff9;padding:20px}.card{width:min(680px,100%);padding:34px;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px rgba(255,255,255,.25),0 30px 90px #0006;backdrop-filter:blur(30px)}.brand{font-weight:950;font-size:22px}.brand b{color:#68ef93}.pulse{height:82px;display:flex;align-items:center;justify-content:center;margin:24px 0}.line{width:190px;height:52px;position:relative}.line:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#8df7ac,#45d87a,#d7ff72);clip-path:polygon(0 52%,20% 52%,29% 25%,40% 80%,53% 35%,64% 58%,100% 58%,100% 66%,61% 66%,54% 50%,40% 96%,29% 45%,24% 61%,0 61%);filter:drop-shadow(0 0 12px #69ef91aa);animation:p 1.2s infinite alternate ease-in-out}@keyframes p{from{opacity:.55;transform:scaleX(.96)}to{opacity:1;transform:scaleX(1.03)}}h1{font-size:clamp(34px,7vw,58px);line-height:.95;letter-spacing:-2px;margin:0 0 12px}.muted{color:#bdd1c4;line-height:1.55}.status{margin-top:20px;padding:13px 15px;border-radius:16px;background:#ffffff0b;border:1px solid #ffffff20}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd95a;margin-right:8px;box-shadow:0 0 0 5px #ffd95a18}.back{display:inline-flex;margin-top:18px;color:#a8f7be;text-decoration:none;font-weight:850}</style></head><body><main class="card"><div class="brand">KENYA <b>PULSE</b></div><div class="pulse"><div class="line"></div></div><h1>Preparing the live experience.</h1><p class="muted">Kenya Pulse is opening the live service securely. If the backend was asleep, this page keeps you out of Render’s wake-up screen and continues automatically as soon as it is ready.</p><div class="status" id="status"><span class="dot"></span>Waking live voting service…</div><a class="back" href="index.html">← Back to homepage</a></main><script>const API='https://kenya-pulse-live.onrender.com';const routes={participate:'/participate',candidates:'/candidate-explorer',profile:'/claim-profile',ground:'/ground',privacy:'/privacy',terms:'/terms',methodology:'/methodology'};const key=new URLSearchParams(location.search).get('to')||'participate';const target=routes[key]||routes.participate;let tries=0;async function check(){tries++;try{const c=new AbortController();const t=setTimeout(()=>c.abort(),6500);const r=await fetch(API+'/healthz',{cache:'no-store',signal:c.signal,credentials:'include'});clearTimeout(t);if(r.ok){document.getElementById('status').innerHTML='<span class="dot" style="background:#69ef91"></span>Live service ready. Opening…';setTimeout(()=>location.href=API+target,350);return}}catch(e){}document.getElementById('status').innerHTML='<span class="dot"></span>'+(tries<8?'Preparing live service… attempt '+tries:'Still waking. Retrying automatically…');setTimeout(check,tries<4?1800:3000)}check();</script></body></html>
